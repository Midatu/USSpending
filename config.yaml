# Nastavení sledování vládních kontraktů USA
# Po úpravě stačí soubor uložit (commit) na GitHubu, další běh už použije nové hodnoty.

# Minimální výše kontraktu / navýšení v USD
min_castka: 1000000

# Kontakt pro SEC (SEC vyžaduje u stahování seznamu tickerů jméno a e-mail).
# Doporučení: použij svou anonymní adresu z GitHubu ve tvaru
#   12345678+uzivatel@users.noreply.github.com
# (najdeš ji v GitHub > Settings > Emails). Nevkládej sem soukromý e-mail, repozitář je veřejný.
sec_kontakt: "GovContractTracker admin@example.com"

# USAspending: kolik dní zpět hledat záznamy, které byly v databázi nově přidány nebo upraveny
usaspending_dny_zpet: 3

# Ignorovat záznamy USAspending, jejichž datum udělení je starší než X dní
# (DoD kontrakty se v USAspending objevují zhruba se 90denním zpožděním, proto 150)
max_stari_kontraktu_dni: 150

# Kolik detailů kontraktů (mateřská společnost, popis) dotáhnout z USAspending za jeden běh
max_detailu_za_beh: 400

# Oznámení DoD: kolik posledních denních oznámení kontrolovat (už zpracovaná se přeskočí)
dod_pocet_oznameni: 10

# Jak dlouho držet kontrakty (dny od data udělení). 0 = uchovávat navždy (doporučeno).
uchovavat_dni: 0

# Graf vývoje akcie: maximální počet bodů v grafu
graf_max_bodu: 40

# SAM.gov (oznámení o udělení zakázek). Potřebuje API klíč uložený jako GitHub Secret SAM_API_KEY.
# Osobní klíč má malý denní limit dotazů, proto se dotazujeme jen každé 3 hodiny (8 dotazů denně).
sam_kazdych_hodin: 3
sam_dny_zpet: 2

# SEC 8-K (kontrakty oznámené samotnými firmami)
sec_dny_zpet: 3
sec_max_dokumentu_za_beh: 120

# ---------- Zprávy o firmách (podstránka Zprávy) ----------
# Sledují se firmy s tickerem, které mají kontrakt za posledních X měsíců.
zpravy_zapnuto: true
zpravy_mesicu: 6
# Zdroje (veřejné RSS kanály). Když některý zdroj odběr zakáže (robots.txt), program ho sám přeskočí.
zpravy_yahoo: true
zpravy_google: true
# Jak často kontrolovat zprávy u jedné firmy (hodiny) a kolik firem nejvýš za jeden hodinový běh
zpravy_kazdych_hodin: 3
zpravy_max_tickeru_za_beh: 60
# Pauza mezi dotazy na stejný zdroj (sekundy), ať servery zbytečně nezatěžujeme
zpravy_pauza_s: 1.5
# Jak dlouho držet jednotlivé zprávy (dny). Denní souhrny sentimentu pro trendy se drží trvale.
zpravy_uchovavat_dni: 180
# Kolik dní zpráv dát do Excelu (list Zprávy)
zpravy_excel_dni: 90
# Upozornění: vlna = aspoň X negativních (pozitivních) zpráv za 7 dní
zpravy_vlna_min: 3
# Upozornění: změna průměrného sentimentu 7 dní proti předchozím 30 dnům
zpravy_posun_min: 0.3
# Upozornění: nárůst zájmu médií = X násobek obvyklého týdenního počtu zpráv
zpravy_zajem_nasobek: 3
# Upozornění: významný kontrakt = výše kontraktu je aspoň X % tržní kapitalizace firmy
zpravy_vyznamny_kontrakt_pct: 2
